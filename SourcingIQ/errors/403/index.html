<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access denied | SourcingIQ</title>
  <style>
    body{font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:24px;text-align:center}
    .box{max-width:420px}
    h1{font-size:24px;margin:0 0 8px}
    p{color:#94a3b8;line-height:1.5;margin:0 0 24px}
    a,button{display:inline-block;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;text-decoration:none;border:1px solid #475569;background:transparent;color:#e2e8f0;margin:4px}
    a.primary{background:#2563eb;border-color:#2563eb;color:#fff}
  </style>
</head>
<body>
  <main class="box">
    <h1>Access denied</h1>
    <p>Your account doesn't have permission to view that page.</p>
    <a id="home" class="primary" href="../../login-page/login.html">Go to sign in</a>
    <button id="out" type="button">Sign out</button>
  </main>
  <script type="module">
    import { getSession, dashboardUrlFor, logout } from '../../shared/js/auth.js';
    const user = getSession();
    if (user) {
      const home = document.getElementById('home');
      home.href = dashboardUrlFor(user.role);
      home.textContent = 'Back to my dashboard';
    }
    document.getElementById('out').addEventListener('click', logout);
  </script>
</body>
</html>
